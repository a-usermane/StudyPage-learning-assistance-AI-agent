<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程书桌 · 本地学习空间</title>
<link rel="stylesheet" href="/static/vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="/static/style.css?v=6">
<script type="module" src="/static/app.js?v=6"></script></head>
<body>
<header class="topbar"><nav aria-label="顶部菜单">
<details class="menu"><summary>文件</summary><div class="menu-items"><button data-command="new">新建课程</button><button data-command="add">在此项目中添加资料</button></div></details>
<details class="menu"><summary>编辑</summary><div class="menu-items"><button data-command="copy">复制选中文字</button><button data-command="clear">清空未发送输入</button></div></details>
<details class="menu"><summary>视图</summary><div class="menu-items"><button data-command="menu">显示 / 隐藏课程菜单</button><button data-command="swap">交换对话与资料</button><button data-command="fit">适合宽度</button></div></details>
<details class="menu"><summary>帮助</summary><div class="menu-items"><button data-command="help">使用说明</button><button data-command="demo">演示模式说明</button></div></details>
</nav><span class="top-title">课程书桌</span><span id="agent-mode-label" class="demo-badge">演示模式，未连接 AI</span></header>
<div class="app-shell" id="app-shell">
<aside class="icon-sidebar" aria-label="导航"><button id="home-button" class="icon-button" title="回到起始页" aria-label="回到起始页">⌂</button><button id="plugins-button" class="icon-button" title="插件自定义 · 暂未实现" aria-label="插件自定义，暂未实现">◇</button><button id="menu-button" class="icon-button" title="课程菜单" aria-label="展开课程菜单" aria-expanded="true">☰</button><div class="sidebar-spacer"></div><button id="settings-button" class="icon-button" title="设置" aria-label="设置">⚙</button></aside>
<div id="content-frame" class="content-frame"><div id="course-menu-slot" class="course-menu-slot"><aside id="course-menu" class="course-menu" aria-label="课程菜单"><div class="course-menu-header"><span>课程</span><button id="menu-close" class="quiet" aria-label="收起课程菜单">×</button></div><button id="menu-new" class="new-course">＋ 新建课程</button><div id="course-list" class="course-list"></div><div class="menu-footer">资料本机保存 · AI 可选</div></aside>
</div><button id="drawer-backdrop" class="drawer-backdrop" aria-label="关闭课程菜单" hidden></button>
<main class="main-content">
<section id="home-page" class="home-page"><div class="home-center"><span class="eyebrow">你的本地学习空间</span><h1>从一门课程开始</h1><p>整理资料，边读边问，留下自己的理解。</p><div class="home-options"><button id="existing-courses"><span class="option-icon">▤</span><strong>查看已有课程</strong><small>继续阅读与学习</small></button><button id="home-new"><span class="option-icon">＋</span><strong>新建课程</strong><small>命名课程并导入资料</small></button></div><div id="home-course-list" class="home-course-list" hidden></div><p class="home-hint">资料和笔记保存在本机。AI 模式按需发送相关文本。</p></div></section>
<section id="settings-page" class="settings-page" hidden><span class="eyebrow">偏好设置</span><h1>设置</h1><p>设置页面暂未实现。阅读布局与划词翻译开关会自动记住。</p><button id="settings-home" class="quiet">返回起始页</button></section>
<section id="course-page" class="course-page" hidden>
<div class="mobile-panes"><button data-pane="chat">对话</button><button data-pane="reader">资料</button></div>
<div id="failed-uploads" class="failed-uploads" hidden><details><summary id="failed-count"></summary><p id="failed-detail"></p></details><button id="retry-uploads" class="quiet">重试失败项</button></div>
<div id="workspace" class="workspace" data-mobile-pane="reader">
<section class="conversation" aria-label="对话与笔记"><div class="conversation-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg><h1 id="course-heading">课程</h1></div><div class="panel-heading"><div class="tabs" role="tablist"><button id="tab-chat" role="tab" aria-controls="chat-panel" aria-selected="true" class="tab active">对话</button><button id="tab-notes" role="tab" aria-controls="notes-panel" aria-selected="false" class="tab">笔记 <span id="note-count">0</span></button></div><span class="muted local-label">本地保存</span></div>
<div id="chat-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-chat"><div id="messages" class="messages" aria-live="polite"></div><form id="chat-form" class="composer"><div id="context-label" class="context-label">先选择课程资料</div><label class="sr-only" for="question">课程问题</label><textarea id="question" rows="1" maxlength="2000" placeholder="对当前资料提问…" disabled></textarea><div class="composer-footer"><small>Ctrl + Enter 发送</small><button id="send" class="primary" disabled>发送</button></div></form></div>
<div id="notes-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-notes" hidden><div class="notes-filter"><label><input type="checkbox" id="notes-current"> 仅当前文件</label></div><div id="notes-list" class="notes-list"></div></div></section>
<div id="splitter" class="splitter" role="separator" aria-label="调整对话与资料宽度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="65" aria-valuenow="38" tabindex="0"></div>
<section class="reader" aria-label="资料阅读"><div class="reader-header"><div class="file-title"><strong id="document-name">尚无资料</strong><select id="document-select" aria-label="切换课程资料"></select></div><button id="delete-document" class="quiet danger" disabled>删除</button></div>
<div class="reader-toolbar"><div class="zoom-controls"><button id="zoom-out" class="quiet" aria-label="缩小" disabled>−</button><span id="zoom-label">适合宽度</span><button id="zoom-in" class="quiet" aria-label="放大" disabled>＋</button><button id="fit-width" class="quiet" disabled>适合宽度</button></div><label class="translation-switch"><input id="translation-toggle" type="checkbox" disabled> 划词翻译</label><button id="summary" class="quiet" disabled>当前页内容预览</button></div>
<div id="document-warning" class="document-warning" hidden></div><div class="reader-body"><div id="reader-surface" class="reader-surface"><div id="viewer"></div></div></div><footer class="reader-footer"><span id="location-status"></span><span>连续阅读 · 代码仅供查看</span></footer></section>
</div></section>
</main></div></div>
<div id="selection-toolbar" class="selection-toolbar" role="toolbar" aria-label="选中文字操作" hidden><button data-selection-action="explain">解释</button><button data-selection-action="ask">提问</button><button data-selection-action="note">保存笔记</button></div>
<aside id="selection-popup" class="selection-popup" role="dialog" aria-labelledby="popup-title" hidden>
<h2 id="popup-title" class="sr-only">翻译</h2><div class="popup-header"><div class="popup-tabs" role="tablist" aria-label="选区操作"><button type="button" id="popup-tab-translate" role="tab" aria-controls="popup-panel" aria-selected="true" tabindex="0" data-popup-action="translate">翻译</button><button type="button" id="popup-tab-explain" role="tab" aria-controls="popup-panel" aria-selected="false" tabindex="-1" data-popup-action="explain">解释</button><button type="button" id="popup-tab-ask" role="tab" aria-controls="popup-panel" aria-selected="false" tabindex="-1" data-popup-action="ask">提问</button><button type="button" id="popup-tab-note" role="tab" aria-controls="popup-panel" aria-selected="false" tabindex="-1" data-popup-action="note">笔记</button></div><button id="popup-close" type="button" class="quiet popup-close" aria-label="关闭弹窗">×</button></div>
<div id="popup-panel" class="popup-panel" role="tabpanel" aria-labelledby="popup-tab-translate"><div id="popup-result-content" class="popup-result"><span id="popup-demo" class="demo-badge" hidden>演示模式，未连接 AI</span><p id="popup-question-snapshot" class="popup-question-snapshot" hidden></p><div id="popup-answer" class="popup-answer" aria-live="polite"></div><button id="popup-retry" type="button" class="quiet" hidden>重试</button><details id="popup-original" class="popup-original"><summary id="popup-quote-summary">原文</summary><blockquote id="popup-quote"></blockquote></details><div id="popup-source"></div></div>
<form id="popup-form" class="popup-input"><button id="popup-input-entry" type="button" class="input-entry" aria-expanded="false" aria-controls="popup-editor">输入你的问题…</button><div id="popup-editor" class="popup-editor" hidden><label for="popup-question" class="sr-only">关于所选内容的问题</label><textarea id="popup-question" rows="2" maxlength="2000"></textarea><label for="note-body" class="sr-only">自己的理解</label><textarea id="note-body" rows="2" maxlength="5000" hidden></textarea><div class="popup-editor-footer"><button id="popup-collapse" type="button" class="quiet">收起</button><span>Ctrl + Enter</span><button id="popup-submit" type="submit" class="primary">查看演示回复</button></div></div></form>
<label id="popup-attach" class="popup-attach" hidden><input id="popup-include-reply" type="checkbox" checked><span id="popup-attach-label">附带已有回复</span></label></div>
<div class="popup-actions"><button id="popup-copy" type="button" class="quiet" disabled>复制内容</button><button id="popup-transfer" type="button" class="quiet" disabled>转入主对话</button><button id="popup-save" type="button" class="primary">保存笔记</button></div></aside>
<dialog id="upload-dialog"><form id="upload-form"><div class="dialog-header"><h2 id="upload-title">新建课程</h2><button id="upload-close" type="button" class="quiet" aria-label="取消上传">×</button></div><label id="course-name-row" class="field">课程名称<input id="course-name" maxlength="100" placeholder="例如：数据结构"></label><label class="upload-picker">＋ 选择资料，可多选<input id="course-files" type="file" multiple accept=".pdf,.pptx,.txt,.md,.py,.js,.ts,.tsx,.jsx,.java,.c,.cpp,.h,.hpp,.cs,.go,.rs,.rb,.php,.sql,.json,.yaml,.yml,.html,.css,.ipynb,.r,.m"></label><button id="sample-toggle" type="button" class="quiet">使用本地验证样例</button><div id="sample-list" class="sample-list" hidden></div><div id="upload-queue" class="upload-queue"></div><p id="upload-status" class="muted"></p><div class="dialog-footer"><button id="upload-submit" type="submit" class="primary" disabled>导入并进入课程</button></div></form></dialog>
<dialog id="help-dialog"><div class="dialog-header"><h2 id="help-title">使用说明</h2><button id="help-close" class="quiet" aria-label="关闭帮助">×</button></div><div id="help-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
